{{define "title"}}{{.Page.Title}}{{end}}
{{define "main"}}
<h1>{{.Page.Title}}</h1>
{{range paragraphs .Page.Body}}<p class="lede">{{.}}</p>
{{end}}
{{if .Experiments}}
<section>
  <h2>Experiments</h2>
  <ul class="experiments">
    {{range .Experiments}}<li><strong>{{.Title}}</strong><p>{{.Summary}}</p></li>{{end}}
  </ul>
</section>
{{end}}
{{end}}
