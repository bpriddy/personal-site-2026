<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Add to Home Screen → full-screen standalone (no Safari chrome); the
         translucent status bar lets the canvas run under the Dynamic Island -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Ben Priddy</title>
    <!-- site host API (window.site), served at the user-content origin root
         when this runs as a site front end — must load before the app. Under
         `trunk serve` it is missing, and the app runs standalone. -->
    <script src="/site-host.js"></script>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" />
    <!-- UI + dev-tooling glue (dials, section editor, modal, GPU error shim),
         loaded at end-of-body — see ui.js. copy-file ships it verbatim to dist. -->
    <link data-trunk rel="copy-file" href="ui.js" />
    <link data-trunk rel="copy-file" href="content.js" />
    <!-- the site's content, baked at build time (scripts/bake-stream.sh) -->
    <link data-trunk rel="inline" href="baked/site.js" />
    <link rel="preload" href="/fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      :root {
        --ink: #e8e2d6;
        --dim: #9a948a;
        --accent: #f2a35e;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
      /* touch-action:none keeps mobile from claiming a finger-drag as a
         scroll/zoom/URL-bar gesture (which fires touchcancel and kills the
         stream perturbance); scoped to the canvas so the modal still scrolls */
      #canvas {
        display: block; position: fixed; inset: 0;
        width: 100%; height: 100%;
        background: #000;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }

      #fps {
        position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(14px + env(safe-area-inset-left));
        font: 11px/1.4 ui-monospace, Menlo, monospace;
        color: rgba(80, 64, 44, 0.5);
        background: rgba(255, 255, 255, 0.4);
        padding: 4px 8px; border-radius: 6px;
        white-space: pre; pointer-events: none;
        backdrop-filter: blur(4px);
      }

      /* debug dials */
      #dials, #dials2 {
        position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: calc(18px + env(safe-area-inset-left)); z-index: 9;
        width: 250px; padding: 12px 14px 10px;
        border-radius: 10px;
        border: 1px solid rgba(138, 90, 40, 0.35);
        background: rgba(14, 11, 8, 0.82);
        backdrop-filter: blur(8px);
        font: 11px/1.5 ui-monospace, Menlo, monospace;
        color: #d8cfc0;
      }
      #dials.hidden, #dials2.hidden { display: none; }
      #dials h3, #dials2 h3 {
        margin: 0 0 6px; font: 700 11px/1 ui-monospace, Menlo, monospace;
        color: #f2a35e; letter-spacing: 0.08em;
      }
      #dials .row, #dials2 .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
      #dials label, #dials2 label { flex: 0 0 74px; color: #b0a694; }
      #dials input[type=range], #dials2 input[type=range] { flex: 1; accent-color: #f2a35e; height: 14px; }
      #dials .val, #dials2 .val { flex: 0 0 42px; text-align: right; color: #f2e9d8; }
      #dial-save, #dial-save2 {
        display: block; width: 100%; margin-top: 8px; padding: 7px;
        border: 1px solid rgba(242, 163, 94, 0.4); border-radius: 0;
        background: transparent; color: #f2a35e;
        font: 700 10px/1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.12em; cursor: pointer;
      }
      #dial-save:hover, #dial-save2:hover { background: rgba(242, 163, 94, 0.15); }
      #dial-close, #dial-close2 {
        position: absolute; top: 6px; right: 8px;
        width: 22px; height: 22px;
        display: flex; align-items: center; justify-content: center;
        border: none; background: transparent; color: #d8cfc0;
        font: 300 20px/1 -apple-system, system-ui, sans-serif; cursor: pointer;
      }
      #dial-close:hover, #dial-close2:hover { color: #f2a35e; }
      #gear, #gear2 {
        position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: calc(18px + env(safe-area-inset-left)); z-index: 8;
        width: 34px; height: 34px; border-radius: 50%;
        border: 1px solid rgba(138, 90, 40, 0.4);
        background: rgba(255, 255, 255, 0.55); color: #8a5a28;
        font: 600 15px/1 system-ui; cursor: pointer;
        backdrop-filter: blur(6px);
      }
      /* feel-dials button stacks above the gear (⚙) and phrase (✎) buttons */
      #gear2 { bottom: calc(102px + env(safe-area-inset-bottom)); font-size: 17px; }

      /* phrase editor */
      #phrases {
        position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: calc(18px + env(safe-area-inset-left)); z-index: 9;
        width: 300px; padding: 12px 14px 12px;
        border-radius: 10px;
        border: 1px solid rgba(138, 90, 40, 0.35);
        background: rgba(14, 11, 8, 0.9);
        backdrop-filter: blur(8px);
        font: 11px/1.5 ui-monospace, Menlo, monospace;
        color: #d8cfc0;
      }
      #phrases.hidden { display: none; }
      #phrases h3 {
        margin: 0 0 4px; font: 700 11px/1 ui-monospace, Menlo, monospace;
        color: #f2a35e; letter-spacing: 0.08em;
      }
      #phrases .hint { margin: 0 0 8px; color: #9a8f7d; font-size: 10px; }
      #phrase-text {
        width: 100%; box-sizing: border-box; height: 230px; resize: vertical;
        background: rgba(0, 0, 0, 0.35); color: #f2e9d8;
        border: 1px solid rgba(138, 90, 40, 0.3); border-radius: 0;
        font: 12px/1.6 ui-monospace, Menlo, monospace; padding: 8px;
      }
      #phrase-text.invalid { border-color: #c0563a; }
      #phrase-save {
        display: block; width: 100%; margin-top: 8px; padding: 7px;
        border: 1px solid rgba(242, 163, 94, 0.4); border-radius: 0;
        background: transparent; color: #f2a35e;
        font: 700 10px/1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.12em; cursor: pointer;
      }
      #phrase-save:hover { background: rgba(242, 163, 94, 0.15); }
      #phrase-close {
        position: absolute; top: 6px; right: 8px;
        width: 22px; height: 22px;
        display: flex; align-items: center; justify-content: center;
        border: none; background: transparent; color: #d8cfc0;
        font: 300 20px/1 -apple-system, system-ui, sans-serif; cursor: pointer;
      }
      #phrase-close:hover { color: #f2a35e; }
      #phrase-btn {
        position: fixed; bottom: calc(60px + env(safe-area-inset-bottom)); left: calc(18px + env(safe-area-inset-left)); z-index: 8;
        width: 34px; height: 34px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid rgba(138, 90, 40, 0.4);
        background: rgba(255, 255, 255, 0.55); color: #8a5a28;
        font: 600 15px/1 system-ui; cursor: pointer;
        backdrop-filter: blur(6px);
      }


      /* ── the site layer (content.js): paged screens over the stream. Big
         type (.ob-glyph) is drawn by the GPU in relief once it's up (html.gpu-type);
         until then, or without WebGPU, the DOM shows it. Every .ob-* element is
         measured into the stream's obstacle field. ── */
      @font-face { font-family: "Inter Tight"; src: url("/fonts/inter-tight.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Instrument Sans"; src: url("/fonts/instrument-sans-roman.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }
      @font-face { font-family: "Geist Mono"; src: url("/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
      :root {
        --panel: rgba(9, 8, 7, 0.86);
        /* plates: the GPU draws them in the type's relief; this is their
           colour only until it does (or without WebGPU) */
        --plate: #e6e0d2;
        --plate-ink: #17130f;
        --plate-dim: #5b5248;
        --plate-accent: #a34a12;
        --line: rgba(232, 226, 214, 0.14);
        --pad: clamp(18px, 5vw, 72px);
        --top: calc(76px + env(safe-area-inset-top));
        --bottom: calc(72px + env(safe-area-inset-bottom));
        --display: "Inter Tight", system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, monospace;
      }
      body { color: var(--ink); font: 17px/1.55 "Instrument Sans", system-ui, sans-serif; }
      .st-stage { position: fixed; inset: 0; pointer-events: none; }
      .st-screen {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
        gap: clamp(14px, 2.2vh, 26px);
        padding: var(--top) var(--pad) var(--bottom);
        box-sizing: border-box;
        visibility: hidden; will-change: transform, opacity;
      }
      .st-screen.is-on { visibility: visible; pointer-events: auto; }
      .ob-glyph { margin: 0; font-family: var(--display); font-weight: 900; letter-spacing: 0; line-height: .98; color: var(--ink); }
      html.gpu-type .ob-glyph { color: transparent; }
      html.gpu-type .ob-glyph::selection { color: var(--ink); background: rgba(242,163,94,.35); }
      .st-name { font-size: clamp(44px, 11.5vw, 168px); max-width: 11ch; }
      .st-project-name { font-size: clamp(38px, 8.6vw, 132px); max-width: 14ch; }
      .st-h2 { font-size: clamp(36px, 7vw, 104px); }
      .st-tagline, .st-label, .st-now, .st-soon, .st-work-n, .st-work-meta, .st-meta dt, .st-pager-n {
        margin: 0; font: 400 12px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase;
      }
      .st-tagline { color: var(--accent); font-size: 13px; }
      .st-now { color: var(--ink); }
      .st-label { color: var(--dim); }
      .st-soon { color: var(--accent); font-size: 14px; }
      /* short text sits on a pill (measured as a box) */
      .ob-word {
        background: var(--plate); color: var(--plate-ink); border-radius: 3px; padding: 7px 14px;
        width: fit-content; box-sizing: border-box;
      }
      .st-panel {
        margin: 0; box-sizing: border-box;
        width: min(100%, 760px); max-height: 100%; overflow: auto; overscroll-behavior: contain;
        padding: clamp(20px, 3.4vw, 40px);
        background: var(--panel); border-radius: 18px;
        scrollbar-width: thin; scrollbar-color: rgba(232,226,214,.25) transparent;
      }
      .st-panel .st-label { margin-bottom: 14px; }
      .st-read { align-items: center; }
      .st-lede { margin: 0; font-size: clamp(19px, 2.1vw, 26px); line-height: 1.42; letter-spacing: -.005em; }
      .st-lede + .st-lede { margin-top: 1em; }
      .st-body { margin: 0 0 1em; color: #d4cdbf; }
      .st-body:last-child { margin-bottom: 0; }
      .st-xp-screen { justify-content: center; }
      .st-xp { list-style: none; width: min(100%, 980px); padding-top: 8px; padding-bottom: 8px; }
      .st-xp-item { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr); gap: 4px 28px; padding: 14px 0; border-bottom: 1px solid var(--line); }
      .st-xp-item:last-child { border-bottom: 0; }
      .st-xp-dates { margin: 3px 0 0; font: 400 11px/1.5 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
      .st-xp-role { margin: 0; font: 600 18px/1.25 "Instrument Sans", system-ui, sans-serif; }
      .st-xp-company { margin: 2px 0 0; color: var(--accent); }
      .st-xp-note { margin: 6px 0 0; color: #c9c2b5; font-size: 15px; line-height: 1.45; }
      .st-work { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(6px, 1.4vh, 14px); }
      .st-work-link { display: grid; justify-items: start; gap: 6px; color: inherit; text-decoration: none; }
      .st-work-title { font-size: clamp(24px, 4.3vw, 58px); }
      .st-work-meta { color: var(--dim); font-size: 11px; padding: 4px 10px; }
      .st-work-link:hover .st-work-meta, .st-work-link:focus-visible .st-work-meta { color: var(--accent); }
      .st-work-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 4px; }
      .st-meta { display: flex; flex-wrap: wrap; gap: 14px 36px; margin: 6px 0 0; }
      .st-meta dt { color: var(--dim); font-size: 11px; }
      .st-meta dd { margin: 3px 0 0; font-weight: 600; }
      .st-media { margin: 0; overflow: hidden; background: #111; border-radius: 14px; }
      .st-media img, .st-media video { display: block; width: 100%; height: 100%; object-fit: cover; }
      .st-split { flex-direction: row; align-items: center; justify-content: center; gap: clamp(16px, 3vw, 40px); }
      .st-split .st-media { flex: 1 1 0; max-width: 680px; max-height: 70vh; }
      .st-split .st-panel { flex: 1 1 0; max-width: 560px; }
      .st-gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: center; gap: 14px; }
      .st-gallery .st-media { max-height: 34vh; }
      .st-links { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 0 0 18px; }
      .st-link {
        font: 600 15px/1.4 "Instrument Sans", system-ui, sans-serif; color: var(--ink);
        background: none; border: 0; padding: 0 0 2px; cursor: pointer; text-decoration: none;
        border-bottom: 1px solid rgba(242,163,94,.5);
      }
      .st-link.ob-word { border: 0; padding: 8px 16px; color: var(--plate-ink); }
      html.gpu-type .ob-word { background: transparent; }
      /* a plate holding a group: label, lines, links, a list */
      .st-plate { display: grid; justify-items: start; gap: 8px; padding: 16px 20px; }
      .st-plate p { margin: 0; }
      .st-plate .st-label, .st-plate .st-work-meta, .st-plate .st-meta dt { color: var(--plate-dim); }
      .st-plate .st-tagline { color: var(--plate-accent); }
      .st-plate .st-now { color: var(--plate-ink); }
      .st-plate .st-meta { margin: 2px 0 0; gap: 10px 32px; }
      .st-plate .st-link { color: var(--plate-ink); border-bottom-color: rgba(163,74,18,.55); }
      .st-plate .st-link:hover, .st-plate .st-link:focus-visible { color: var(--plate-accent); border-bottom-color: var(--plate-accent); }
      .st-plate .st-links { margin: 0; }
      .st-list { display: grid; justify-items: start; gap: clamp(10px, 1.6vh, 16px); }
      .st-list .st-work { gap: clamp(4px, 1vh, 10px); }
      .st-work-title { display: block; }
      .st-work-link:hover .st-work-title, .st-work-link:focus-visible .st-work-title { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; }
      .ob-word.st-label, .ob-word.st-work-meta, .ob-word .st-pager-n, .st-meta .ob-word dt, .ob-word .st-nav-link { color: var(--plate-dim); }
      .ob-word.st-tagline, .ob-word.st-soon, .st-work-link:hover .st-work-meta, .st-work-link:focus-visible .st-work-meta,
      .st-link.ob-word:hover, .st-link.ob-word:focus-visible, .ob-word .st-pager-b:not(:disabled):hover, .ob-word .st-pager-b:focus-visible { color: var(--plate-accent); }
      .ob-word .st-nav-link:hover, .ob-word .st-nav-link:focus-visible, .ob-word .st-nav-link[aria-current="page"], .ob-word .st-pager-b, .ob-word.st-now { color: var(--plate-ink); }
      .st-link:hover, .st-link:focus-visible { border-bottom-color: var(--accent); color: var(--accent); }
      .st-next-link { text-decoration: none; color: inherit; }
      .st-more { margin: 4px 0 0; }
      /* the site menu: big relief type, top right, no surface */
      .st-nav {
        position: fixed; z-index: 3; top: calc(20px + env(safe-area-inset-top)); right: var(--pad);
        max-width: calc(100% - 2 * var(--pad));
        display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px clamp(14px, 1.8vw, 26px);
      }
      .st-nav-link {
        font-size: clamp(20px, 2.4vw, 34px); text-decoration: none;
        padding-bottom: 4px; border-bottom: 3px solid transparent;
      }
      .st-nav-link:hover, .st-nav-link:focus-visible { border-bottom-color: rgba(242,163,94,.55); outline: none; }
      .st-nav-link[aria-current="page"] { border-bottom-color: var(--accent); }
      .st-pager {
        position: fixed; z-index: 3; right: var(--pad); bottom: calc(22px + env(safe-area-inset-bottom));
        display: flex; align-items: center; gap: 14px; padding: 4px 16px;
      }
      .st-pager[hidden] { display: none; }
      .st-pager-n { color: var(--dim); min-width: 5.5em; text-align: center; }
      .st-pager-b {
        font: 600 13px/1 "Instrument Sans", system-ui, sans-serif; color: var(--ink);
        background: none; border: 0; padding: 6px 0; cursor: pointer;
      }
      .st-pager-b:disabled { opacity: .3; cursor: default; }
      .st-pager-b:not(:disabled):hover, .st-pager-b:focus-visible { color: var(--accent); }
      @media (max-width: 720px) {
        body { font-size: 16px; }
        .st-split { flex-direction: column; align-items: stretch; }
        .st-split .st-media { flex: 0 0 auto; max-height: 34vh; }
        .st-split .st-panel { flex: 0 1 auto; max-width: none; }
        .st-gallery { grid-template-columns: 1fr; }
        .st-gallery .st-media { max-height: 24vh; }
        .st-xp-item { grid-template-columns: 1fr; }
        .st-xp-note { display: none; }
        .st-name { font-size: clamp(56px, 19vw, 120px); }
        .st-project-name { font-size: clamp(40px, 12vw, 96px); }
        .st-h2 { font-size: clamp(40px, 13vw, 80px); }
      }

      /* responsive */
      @media (max-width: 640px) {
        #gear, #gear2 { bottom: calc(12px + env(safe-area-inset-bottom)); left: calc(12px + env(safe-area-inset-left)); }
        #gear2 { bottom: calc(96px + env(safe-area-inset-bottom)); }
        #dials, #dials2 {
          bottom: calc(12px + env(safe-area-inset-bottom)); left: calc(12px + env(safe-area-inset-left));
          width: calc(100vw - 24px - 28px);
          max-width: 250px;
        }
        #fps { top: calc(8px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); font-size: 10px; }
        #phrase-btn { bottom: calc(54px + env(safe-area-inset-bottom)); left: calc(12px + env(safe-area-inset-left)); }
        #phrases { bottom: calc(12px + env(safe-area-inset-bottom)); left: calc(12px + env(safe-area-inset-left)); width: calc(100vw - 24px - 28px); max-width: 300px; }
      }


    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="fps">starting…</div>


    <button id="phrase-btn" title="edit phrases (p)">✎</button>
    <div id="phrases" class="hidden">
      <button id="phrase-close" aria-label="Close">×</button>
      <h3>PHRASES</h3>
      <p class="hint">JSON string array · each line cycles centered on screen</p>
      <textarea id="phrase-text" spellcheck="false"></textarea>
      <button id="phrase-save" title="write phrases.json in place">SAVE PHRASES.JSON</button>
    </div>
    <button id="gear" title="tuning dials (d)">⚙</button>
    <div id="dials" class="hidden">
      <button id="dial-close" aria-label="Close">×</button>
      <h3>FLOW DIALS</h3>
      <div class="row"><label>rot speed</label><input type="range" min="0" max="0.6" step="0.005" data-dial="rot_speed"><span class="val"></span></div>
      <div class="row"><label>rot depth</label><input type="range" min="0" max="6.4" step="0.05" data-dial="rot_depth"><span class="val"></span></div>
      <div class="row"><label>stream</label><input type="range" min="0.05" max="0.9" step="0.01" data-dial="stream"><span class="val"></span></div>
      <div class="row"><label>turbulence</label><input type="range" min="0" max="3" step="0.05" data-dial="turb"><span class="val"></span></div>
      <div class="row"><label>eddies</label><input type="range" min="0" max="3" step="0.05" data-dial="eddy"><span class="val"></span></div>
      <div class="row"><label>sparkle</label><input type="range" min="0" max="3" step="0.05" data-dial="spark"><span class="val"></span></div>
      <div class="row"><label>bg scale</label><input type="range" min="0.4" max="10" step="0.1" data-dial="bg_freq"><span class="val"></span></div>
      <div class="row"><label>text sat</label><input type="range" min="0" max="1" step="0.02" data-dial="text_sat"><span class="val"></span></div>
      <div class="row"><label>bg speed</label><input type="range" min="0" max="10" step="0.1" data-dial="bg_speed"><span class="val"></span></div>
      <div class="row"><label>perturb</label><input type="range" min="0" max="3" step="0.05" data-dial="perturb"><span class="val"></span></div>
      <button id="dial-save" title="download dials.json for the repo">SAVE DIALS.JSON</button>
    </div>
    <button id="gear2" title="feel / drag dials (f)">≈</button>
    <div id="dials2" class="hidden">
      <button id="dial-close2" aria-label="Close">×</button>
      <h3>FEEL DIALS</h3>
      <div class="row"><label>wake</label><input type="range" min="0" max="3" step="0.05" data-dial="wake"><span class="val"></span></div>
      <div class="row"><label>porosity</label><input type="range" min="0" max="1" step="0.02" data-dial="porosity"><span class="val"></span></div>
      <div class="row"><label>name lead</label><input type="range" min="1" max="3" step="0.05" data-dial="name_lead"><span class="val"></span></div>
      <div class="row"><label>commit</label><input type="range" min="0.1" max="0.6" step="0.02" data-dial="commit"><span class="val"></span></div>
      <div class="row"><label>wake width</label><input type="range" min="0" max="0.35" step="0.01" data-dial="wake_width"><span class="val"></span></div>
