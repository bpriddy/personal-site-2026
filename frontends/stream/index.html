<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Add to Home Screen → full-screen standalone (no Safari chrome); the
         translucent status bar lets the canvas run under the Dynamic Island -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Ben Priddy</title>
    <!-- site host API (window.site), served at the user-content origin root
         when this runs as a site front end — must load before the app. Under
         `trunk serve` it is missing, and the app runs standalone. -->
    <script src="/site-host.js"></script>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" />
    <!-- UI + dev-tooling glue (dials, section editor, modal, GPU error shim),
         loaded at end-of-body — see ui.js. copy-file ships it verbatim to dist. -->
    <link data-trunk rel="copy-file" href="ui.js" />
    <link data-trunk rel="copy-file" href="content.js" />
    <style>
      :root {
        --ink: #e8e2d6;
        --dim: #9a948a;
        --accent: #f2a35e;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
      /* touch-action:none keeps mobile from claiming a finger-drag as a
         scroll/zoom/URL-bar gesture (which fires touchcancel and kills the
         stream perturbance); scoped to the canvas so the modal still scrolls */
      #canvas {
        display: block; position: fixed; inset: 0;
        width: 100%; height: 100%;
        background: #000;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }

      #fps {
        position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(14px + env(safe-area-inset-left));
        font: 11px/1.4 ui-monospace, Menlo, monospace;
        color: rgba(80, 64, 44, 0.5);
        background: rgba(255, 255, 255, 0.4);
        padding: 4px 8px; border-radius: 6px;
        white-space: pre; pointer-events: none;
        backdrop-filter: blur(4px);
      }

      /* debug dials */
      #dials, #dials2 {
        position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: calc(18px + env(safe-area-inset-left)); z-index: 9;
        width: 250px; padding: 12px 14px 10px;
        border-radius: 10px;
        border: 1px solid rgba(138, 90, 40, 0.35);
        background: rgba(14, 11, 8, 0.82);
        backdrop-filter: blur(8px);
        font: 11px/1.5 ui-monospace, Menlo, monospace;
        color: #d8cfc0;
      }
      #dials.hidden, #dials2.hidden { display: none; }
      #dials h3, #dials2 h3 {
        margin: 0 0 6px; font: 700 11px/1 ui-monospace, Menlo, monospace;
        color: #f2a35e; letter-spacing: 0.08em;
      }
      #dials .row, #dials2 .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
      #dials label, #dials2 label { flex: 0 0 74px; color: #b0a694; }
      #dials input[type=range], #dials2 input[type=range] { flex: 1; accent-color: #f2a35e; height: 14px; }
      #dials .val, #dials2 .val { flex: 0 0 42px; text-align: right; color: #f2e9d8; }
      #dial-save, #dial-save2 {
        display: block; width: 100%; margin-top: 8px; padding: 7px;
        border: 1px solid rgba(242, 163, 94, 0.4); border-radius: 0;
        background: transparent; color: #f2a35e;
        font: 700 10px/1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.12em; cursor: pointer;
      }
      #dial-save:hover, #dial-save2:hover { background: rgba(242, 163, 94, 0.15); }
      #dial-close, #dial-close2 {
        position: absolute; top: 6px; right: 8px;
        width: 22px; height: 22px;
        display: flex; align-items: center; justify-content: center;
        border: none; background: transparent; color: #d8cfc0;
        font: 300 20px/1 -apple-system, system-ui, sans-serif; cursor: pointer;
      }
      #dial-close:hover, #dial-close2:hover { color: #f2a35e; }
      #gear, #gear2 {
        position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: calc(18px + env(safe-area-inset-left)); z-index: 8;
        width: 34px; height: 34px; border-radius: 50%;
        border: 1px solid rgba(138, 90, 40, 0.4);
        background: rgba(255, 255, 255, 0.55); color: #8a5a28;
        font: 600 15px/1 system-ui; cursor: pointer;
        backdrop-filter: blur(6px);
      }
      /* feel-dials button stacks above the gear (⚙) and phrase (✎) buttons */
      #gear2 { bottom: calc(102px + env(safe-area-inset-bottom)); font-size: 17px; }

      /* phrase editor */
      #phrases {
        position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: calc(18px + env(safe-area-inset-left)); z-index: 9;
        width: 300px; padding: 12px 14px 12px;
        border-radius: 10px;
        border: 1px solid rgba(138, 90, 40, 0.35);
        background: rgba(14, 11, 8, 0.9);
        backdrop-filter: blur(8px);
        font: 11px/1.5 ui-monospace, Menlo, monospace;
        color: #d8cfc0;
      }
      #phrases.hidden { display: none; }
      #phrases h3 {
        margin: 0 0 4px; font: 700 11px/1 ui-monospace, Menlo, monospace;
        color: #f2a35e; letter-spacing: 0.08em;
      }
      #phrases .hint { margin: 0 0 8px; color: #9a8f7d; font-size: 10px; }
      #phrase-text {
        width: 100%; box-sizing: border-box; height: 230px; resize: vertical;
        background: rgba(0, 0, 0, 0.35); color: #f2e9d8;
        border: 1px solid rgba(138, 90, 40, 0.3); border-radius: 0;
        font: 12px/1.6 ui-monospace, Menlo, monospace; padding: 8px;
      }
      #phrase-text.invalid { border-color: #c0563a; }
      #phrase-save {
        display: block; width: 100%; margin-top: 8px; padding: 7px;
        border: 1px solid rgba(242, 163, 94, 0.4); border-radius: 0;
        background: transparent; color: #f2a35e;
        font: 700 10px/1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.12em; cursor: pointer;
      }
      #phrase-save:hover { background: rgba(242, 163, 94, 0.15); }
      #phrase-close {
        position: absolute; top: 6px; right: 8px;
        width: 22px; height: 22px;
        display: flex; align-items: center; justify-content: center;
        border: none; background: transparent; color: #d8cfc0;
        font: 300 20px/1 -apple-system, system-ui, sans-serif; cursor: pointer;
      }
      #phrase-close:hover { color: #f2a35e; }
      #phrase-btn {
        position: fixed; bottom: calc(60px + env(safe-area-inset-bottom)); left: calc(18px + env(safe-area-inset-left)); z-index: 8;
        width: 34px; height: 34px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid rgba(138, 90, 40, 0.4);
        background: rgba(255, 255, 255, 0.55); color: #8a5a28;
        font: 600 15px/1 system-ui; cursor: pointer;
        backdrop-filter: blur(6px);
      }


      /* ── the site layer (content.js): the first screen is the stream; the
         content scrolls up over it on a dark sheet ── */
      @font-face { font-family: "Instrument Sans"; src: url("/fonts/instrument-sans-roman.woff2") format("woff2"); font-weight: 400 600; font-stretch: 85% 100%; font-display: swap; }
      @font-face { font-family: "Fragment Mono"; src: url("/fonts/fragment-mono-regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
      .st-page {
        position: fixed; inset: 0; z-index: 2; overflow-y: auto; overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(242,163,94,.4) transparent;
      }
      .st-hero { height: 100vh; height: 100svh; position: relative; pointer-events: none; }
      .st-cue {
        position: absolute; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); margin: 0;
        font: 11px/1 "Fragment Mono", ui-monospace, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
        animation: st-cue 2.4s ease-in-out infinite;
      }
      @keyframes st-cue { 50% { transform: translate(-50%, 6px); opacity: .55; } }
      .st-sheet {
        position: relative; min-height: 60vh;
        padding: clamp(56px, 9vw, 120px) clamp(20px, 8vw, 120px) clamp(80px, 12vw, 160px);
        background: linear-gradient(to bottom, rgba(6,5,4,0) 0, rgba(6,5,4,.9) 160px, rgba(6,5,4,.96) 100%);
        -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 120px); mask-image: linear-gradient(to bottom, transparent 0, #000 120px);
        color: var(--ink); font: 400 17px/1.6 "Instrument Sans", -apple-system, system-ui, sans-serif;
      }
      .st-sheet > * { max-width: 920px; }
      .st-nav {
        position: fixed; z-index: 3; top: calc(16px + env(safe-area-inset-top)); left: calc(18px + env(safe-area-inset-left));
        display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 4px 14px; border-radius: 999px;
        background: rgba(6,5,4,.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        font: 11px/1.2 "Fragment Mono", ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase;
      }
      .st-nav-link { color: var(--dim); text-decoration: none; padding: 6px 0; transition: color .2s ease; }
      .st-nav-link:hover, .st-nav-link:focus-visible { color: var(--ink); }
      .st-nav-link[aria-current="page"] { color: var(--accent); }
      .st-head { margin-bottom: clamp(40px, 6vw, 72px); }
      .st-title {
        margin: 0; font: 900 clamp(44px, 8vw, 112px)/.92 -apple-system, system-ui, sans-serif; letter-spacing: -.035em;
        text-transform: uppercase; color: var(--ink); overflow-wrap: anywhere;
      }
      .st-tagline { margin: 14px 0 0; font: 11px/1.4 "Fragment Mono", ui-monospace, monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
      .st-label { margin: 0 0 18px; font: 11px/1.4 "Fragment Mono", ui-monospace, monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
      .st-section { margin: 0 0 clamp(48px, 7vw, 88px); }
      .st-lede { margin: 0 0 18px; font-size: clamp(20px, 2.2vw, 27px); line-height: 1.35; letter-spacing: -.01em; color: var(--ink); max-width: 34ch; }
      .st-body { margin: 0 0 14px; color: #c9c2b5; max-width: 62ch; }
      .st-empty { color: var(--accent); }
      .st-xp { list-style: none; margin: 0; padding: 0; border-top: 1px solid rgba(232,226,214,.14); }
      .st-xp-item { display: grid; grid-template-columns: minmax(0, 13em) minmax(0, 1fr); gap: 6px 28px; padding: 18px 0; border-bottom: 1px solid rgba(232,226,214,.14); }
      .st-xp-dates { margin: 3px 0 0; font: 11px/1.5 "Fragment Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
      .st-xp-role { margin: 0; font: 600 19px/1.25 "Instrument Sans", system-ui, sans-serif; color: var(--ink); }
      .st-xp-company { margin: 2px 0 0; color: var(--accent); }
      .st-xp-note { margin: 8px 0 0; color: #c9c2b5; max-width: 60ch; }
      .st-work { list-style: none; margin: 0; padding: 0; border-top: 1px solid rgba(232,226,214,.14); }
      .st-work-item { border-bottom: 1px solid rgba(232,226,214,.14); }
      .st-work-link { display: grid; grid-template-columns: 3em minmax(0, 1fr) minmax(0, 220px); gap: 18px; align-items: center; padding: 16px 0; color: inherit; text-decoration: none; }
      .st-work-n { font: 11px/1 "Fragment Mono", ui-monospace, monospace; color: var(--dim); }
      .st-work-text { display: grid; gap: 4px; }
      .st-work-title { font: 900 clamp(20px, 2.6vw, 30px)/1.05 -apple-system, system-ui, sans-serif; letter-spacing: -.02em; text-transform: uppercase; transition: color .2s ease; }
      .st-work-meta { font: 11px/1.4 "Fragment Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
      .st-work-link:hover .st-work-title, .st-work-link:focus-visible .st-work-title { color: var(--accent); }
      .st-media { margin: 0; overflow: hidden; background: #111; }
      .st-media img, .st-media video { display: block; width: 100%; height: 100%; object-fit: cover; }
      .st-work-thumb { aspect-ratio: 3 / 1 !important; opacity: .8; transition: opacity .2s ease; }
      .st-work-link:hover .st-work-thumb { opacity: 1; }
      .st-exp { padding: 18px 0; }
      .st-meta { display: flex; flex-wrap: wrap; gap: 18px 40px; margin: 0 0 40px; }
      .st-meta dt { font: 11px/1.4 "Fragment Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
      .st-meta dd { margin: 4px 0 0; font-weight: 600; }
      .st-hero-media { margin: 0 0 clamp(40px, 6vw, 72px); max-width: 1100px !important; }
      .st-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; max-width: 1100px !important; }
      .st-links { display: flex; flex-wrap: wrap; gap: 12px 28px; margin: 0 0 56px; }
      .st-link {
        font: 11px/1 "Fragment Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase;
        color: var(--accent); background: none; border: 0; padding: 8px 0; cursor: pointer; text-decoration: none;
        border-bottom: 1px solid rgba(242,163,94,.4);
      }
      .st-link:hover, .st-link:focus-visible { border-bottom-color: var(--accent); }
      .st-more { margin: 18px 0 0; }
      .st-next { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 28px; padding-top: 24px; border-top: 1px solid rgba(232,226,214,.14); }
      .st-next .st-label { margin: 0; }
      .st-next-title { font: 900 clamp(22px, 3vw, 34px)/1 -apple-system, system-ui, sans-serif; text-transform: uppercase; color: var(--ink); text-decoration: none; }
      .st-next-title:hover { color: var(--accent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      @media (max-width: 640px) {
        .st-xp-item { grid-template-columns: 1fr; }
        .st-work-link { grid-template-columns: 2.2em minmax(0, 1fr); }
        .st-work-thumb { grid-column: 2; }
        .st-sheet { font-size: 16px; }
      }
      @media (prefers-reduced-motion: reduce) { .st-cue { animation: none; } }

      /* responsive */
      @media (max-width: 640px) {
        #gear, #gear2 { bottom: calc(12px + env(safe-area-inset-bottom)); left: calc(12px + env(safe-area-inset-left)); }
        #gear2 { bottom: calc(96px + env(safe-area-inset-bottom)); }
        #dials, #dials2 {
          bottom: calc(12px + env(safe-area-inset-bottom)); left: calc(12px + env(safe-area-inset-left));
          width: calc(100vw - 24px - 28px);
          max-width: 250px;
        }
        #fps { top: calc(8px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); font-size: 10px; }
        #phrase-btn { bottom: calc(54px + env(safe-area-inset-bottom)); left: calc(12px + env(safe-area-inset-left)); }
        #phrases { bottom: calc(12px + env(safe-area-inset-bottom)); left: calc(12px + env(safe-area-inset-left)); width: calc(100vw - 24px - 28px); max-width: 300px; }
      }


    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="fps">starting…</div>


    <button id="phrase-btn" title="edit phrases (p)">✎</button>
    <div id="phrases" class="hidden">
      <button id="phrase-close" aria-label="Close">×</button>
      <h3>PHRASES</h3>
      <p class="hint">JSON string array · each line cycles centered on screen</p>
      <textarea id="phrase-text" spellcheck="false"></textarea>
      <button id="phrase-save" title="write phrases.json in place">SAVE PHRASES.JSON</button>
    </div>
    <button id="gear" title="tuning dials (d)">⚙</button>
    <div id="dials" class="hidden">
      <button id="dial-close" aria-label="Close">×</button>
      <h3>FLOW DIALS</h3>
      <div class="row"><label>rot speed</label><input type="range" min="0" max="0.6" step="0.005" data-dial="rot_speed"><span class="val"></span></div>
      <div class="row"><label>rot depth</label><input type="range" min="0" max="6.4" step="0.05" data-dial="rot_depth"><span class="val"></span></div>
      <div class="row"><label>stream</label><input type="range" min="0.05" max="0.9" step="0.01" data-dial="stream"><span class="val"></span></div>
      <div class="row"><label>turbulence</label><input type="range" min="0" max="3" step="0.05" data-dial="turb"><span class="val"></span></div>
      <div class="row"><label>eddies</label><input type="range" min="0" max="3" step="0.05" data-dial="eddy"><span class="val"></span></div>
      <div class="row"><label>sparkle</label><input type="range" min="0" max="3" step="0.05" data-dial="spark"><span class="val"></span></div>
      <div class="row"><label>bg scale</label><input type="range" min="0.4" max="10" step="0.1" data-dial="bg_freq"><span class="val"></span></div>
      <div class="row"><label>text sat</label><input type="range" min="0" max="1" step="0.02" data-dial="text_sat"><span class="val"></span></div>
      <div class="row"><label>bg speed</label><input type="range" min="0" max="10" step="0.1" data-dial="bg_speed"><span class="val"></span></div>
      <div class="row"><label>perturb</label><input type="range" min="0" max="3" step="0.05" data-dial="perturb"><span class="val"></span></div>
      <button id="dial-save" title="download dials.json for the repo">SAVE DIALS.JSON</button>
    </div>
    <button id="gear2" title="feel / drag dials (f)">≈</button>
    <div id="dials2" class="hidden">
      <button id="dial-close2" aria-label="Close">×</button>
      <h3>FEEL DIALS</h3>
      <div class="row"><label>wake</label><input type="range" min="0" max="3" step="0.05" data-dial="wake"><span class="val"></span></div>
      <div class="row"><label>porosity</label><input type="range" min="0" max="1" step="0.02" data-dial="porosity"><span class="val"></span></div>
      <div class="row"><label>name lead</label><input type="range" min="1" max="3" step="0.05" data-dial="name_lead"><span class="val"></span></div>
      <div class="row"><label>commit</label><input type="range" min="0.1" max="0.6" step="0.02" data-dial="commit"><span class="val"></span></div>
      <div class="row"><label>wake width</label><input type="range" min="0" max="0.35" step="0.01" data-dial="wake_width"><span class="val"></span></div>
      <div class="row"><label>slide t</label><input type="range" min="0.05" max="1.5" step="0.01" data-dial="entry_slide"><span class="val"></span></div>
      <div class="row"><label>zoom t</label><input type="range" min="0.05" max="1.5" step="0.01" data-dial="entry_zoom"><span class="val"></span></div>
      <div class="row"><label>expand</label><input type="range" min="1" max="12" step="0.1" data-dial="expand"><span class="val"></span></div>
      <div class="row"><label>bump</label><input type="range" min="0" max="1" step="0.01" data-dial="bump"><span class="val"></span></div>
      <button id="dial-save2" title="download dials.json for the repo">SAVE DIALS.JSON</button>
    </div>
    <script src="ui.js"></script>
    <!-- the site layer: content, navigation, the words the stream parts around -->
    <script src="content.js"></script>
  </body>
</html>
