<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebGPU probe</title>
</head>
<body>
<canvas id="c" width="64" height="64"></canvas>
<script type="module">
// Standalone WebGPU feasibility probe used by tests/webgpu-feasibility.spec.ts.
// Sets window.__probe to a JSON-able result object once finished.
async function probe() {
  const out = { hasGpu: "gpu" in navigator && !!navigator.gpu, adapter: null, device: false,
                render: null, compute: null, error: null };
  if (!out.hasGpu) return out;
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) return out;
  const info = adapter.info || {};
  out.adapter = { vendor: info.vendor, architecture: info.architecture, device: info.device,
                  description: info.description, isFallbackAdapter: !!(info.isFallbackAdapter ?? adapter.isFallbackAdapter) };
  const device = await adapter.requestDevice();
  out.device = true;
  device.addEventListener("uncapturederror", (e) => { out.error = String(e.error && e.error.message); });

  // --- render: clear + a full-screen triangle into the canvas, then read a pixel back
  const format = navigator.gpu.getPreferredCanvasFormat();
  const ctx = document.getElementById("c").getContext("webgpu");
  ctx.configure({ device, format, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const shader = device.createShaderModule({ code: `
    @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
      var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
      return vec4f(p[i], 0.0, 1.0);
    }
    @fragment fn fs() -> @location(0) vec4f { return vec4f(1.0, 0.0, 0.0, 1.0); }
  `});
  const pipeline = device.createRenderPipeline({ layout: "auto",
    vertex: { module: shader, entryPoint: "vs" },
    fragment: { module: shader, entryPoint: "fs", targets: [{ format }] } });
  const tex = ctx.getCurrentTexture();
  const readBuf = device.createBuffer({ size: 256, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  let enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: tex.createView(), loadOp: "clear",
    clearValue: { r: 0, g: 0, b: 1, a: 1 }, storeOp: "store" }] });
  pass.setPipeline(pipeline);
  pass.draw(3);
  pass.end();
  enc.copyTextureToBuffer({ texture: tex, origin: { x: 32, y: 32 } }, { buffer: readBuf, bytesPerRow: 256 }, [1, 1]);
  device.queue.submit([enc.finish()]);
  await readBuf.mapAsync(GPUMapMode.READ);
  const px = Array.from(new Uint8Array(readBuf.getMappedRange(), 0, 4));
  readBuf.unmap();
  // bgra8unorm or rgba8unorm: red channel index differs
  const red = format === "bgra8unorm" ? px[2] : px[0];
  out.render = { format, pixel: px, ok: red === 255 };

  // --- compute: double 64 floats
  const n = 64;
  const input = new Float32Array(n).map((_, i) => i);
  const storage = device.createBuffer({ size: input.byteLength,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(storage, 0, input);
  const cm = device.createShaderModule({ code: `
    @group(0) @binding(0) var<storage, read_write> data: array<f32>;
    @compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id: vec3u) {
      data[id.x] = data[id.x] * 2.0;
    }
  `});
  const cp = device.createComputePipeline({ layout: "auto", compute: { module: cm, entryPoint: "main" } });
  const bg = device.createBindGroup({ layout: cp.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: storage } }] });
  const result = device.createBuffer({ size: input.byteLength, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  enc = device.createCommandEncoder();
  const cpass = enc.beginComputePass();
  cpass.setPipeline(cp);
  cpass.setBindGroup(0, bg);
  cpass.dispatchWorkgroups(1);
  cpass.end();
  enc.copyBufferToBuffer(storage, 0, result, 0, input.byteLength);
  device.queue.submit([enc.finish()]);
  await result.mapAsync(GPUMapMode.READ);
  const got = new Float32Array(result.getMappedRange().slice(0));
  result.unmap();
  out.compute = { ok: got.every((v, i) => v === i * 2), sample: Array.from(got.slice(0, 4)) };
  device.destroy();
  return out;
}
probe().then((r) => { window.__probe = r; },
             (e) => { window.__probe = { error: String(e && e.stack || e) }; });
</script>
</body>
</html>
