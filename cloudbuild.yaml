# Builds and pushes both images. Run from the repo root:
#   gcloud builds submit --config cloudbuild.yaml --project benpriddycom \
#     --region us-east1 --service-account projects/benpriddycom/serviceAccounts/site-build@benpriddycom.iam.gserviceaccount.com \
#     --substitutions _TAG=$(git rev-parse --short HEAD) --async
# (--async: with a custom service account gcloud cannot stream the logs; watch
#  them with `gcloud builds log --stream <id> --region us-east1` or in the console)
substitutions:
  _REPO: us-east1-docker.pkg.dev/benpriddycom/site
  _TAG: latest
steps:
  - id: server
    name: gcr.io/cloud-builders/docker
    args: [build, --target, server, -t, "${_REPO}/server:${_TAG}", .]
  - id: usercontent
    name: gcr.io/cloud-builders/docker
    args: [build, --target, usercontent, -t, "${_REPO}/usercontent:${_TAG}", .]
images:
  - ${_REPO}/server:${_TAG}
  - ${_REPO}/usercontent:${_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 3600s
