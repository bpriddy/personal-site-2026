[package]
name = "site"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
  "CanvasRenderingContext2d", "TextMetrics", "CssStyleDeclaration",
  "Performance", "Event", "MouseEvent", "WheelEvent",
  "TouchEvent", "TouchList", "Touch", "console",
] }
wgpu = "29"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
